/robot1/pointcloud_to_laserscan_node:
  ros__parameters:
    use_sim_time: true
    target_frame: "laser_frame"
    transform_tolerance: 0.05
    # Slice a band around the lidar's own height (mounted at z=0.14 on base_link,
    # see robot.xacro) rather than the whole 3D cloud -- keeps low furniture legs
    # and the ceiling out of the 2D scan slam_toolbox consumes.
    min_height: -0.10
    max_height: 0.10
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00349066  # 0.2 deg -> 1800 bins, well under the 900 azimuth samples
    scan_time: 0.1
    range_min: 0.15
    range_max: 25.0
    use_inf: true
    concurrency_level: 1
