# /** (not a bare "slam_toolbox:" key): ROS 2's parameter-YAML matching
# requires the top-level key to be exactly "/**", "/<ns>/**", or the node's
# full fully-qualified name -- a bare, non-slash-prefixed key never matches a
# namespaced node at all. Confirmed live: with the old bare key, EVERY param
# below was silently ignored (`ros2 param get /robot1/slam_toolbox base_frame`
# read back slam_toolbox's own compiled-in default "base_footprint", not this
# file's "base_link"), which is why map->odom TF never appeared -- slam_toolbox
# was trying to track a base_footprint frame that doesn't exist anywhere in
# this URDF. This is the same class of bug as nav_stack.launch.py's Nav2
# namespace fix, just hitting a params file directly instead of via
# nav2_bringup's RewrittenYaml wrapper.
/**:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # matches office_sim.launch.py's odom node, which we patched to publish
    # odom->base_link (not upstream's default "base" -- that was a disconnected
    # dead-end frame, verified via a live TF dump; see the launch file comment).
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # relative, NOT /robot1/scan: slam_toolbox's own topic resolution strips a
    # leading segment matching its own namespace before re-resolving, so an
    # absolute "/robot1/scan" here collapses to bare "/scan" at the root
    # namespace (confirmed live via `ros2 node info /robot1/slam_toolbox` --
    # it was subscribed to /scan, not /robot1/scan, while everything else
    # correctly listens on /robot1/scan). A relative name resolves normally
    # under the namespace PushRosNamespace already applies in nav_stack.launch.py.
    scan_topic: scan

    mode: mapping
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 25.0
    min_laser_range: 0.15
    transform_publish_period: 0.02
    transform_timeout: 0.5  # was 0.3 -- see collision_monitor's comment in
    # nav2_params.yaml: KISS-ICP's odom TF has more jitter than the old fixed-
    # rate kinematic odometry did.
    tf_buffer_duration: 30.0

    # throttle_scans + scan_queue_size added after a real crash this session:
    # slam_toolbox fell behind real-time on this 8-core machine (Gazebo's GUI
    # alone uses ~2 cores) as the pose graph grew -- confirmed via its own log
    # spamming "Message Filter dropping message: ... discarding message
    # because the queue is full" continuously for 4+ minutes before the whole
    # node died. slam_toolbox keeps its entire map/pose-graph in memory only
    # (no disk persistence), so that crash silently wiped the whole
    # accumulated map on restart -- this looked like the map "suddenly
    # resetting" but was actually a full process death.  `throttle_scans: 2`
    # halves the per-scan processing cost (matching scans at ~9-10Hz lidar
    # input still gives ~4-5Hz effective mapping rate, plenty for a slow-
    # walking gait) so average load stays below real-time instead of
    # accumulating an ever-growing backlog; `scan_queue_size` gives a bigger
    # shock absorber for the transient stalls (e.g. loop-closure searches)
    # that will still happen even with throttling.
    throttle_scans: 2
    scan_queue_size: 20

    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 25.0
    # 0.15, not stock 0.1: local scan-to-scan linking is what accumulates
    # into drift between loop closures (loop closure only corrects *after*
    # error has already built up), so a slightly stricter bar here means a
    # marginal local match is more likely to fall back on raw KISS-ICP odometry
    # for that one link rather than getting baked into the pose graph as if
    # it were a good match. Small step, not stock's 0.1 doubled or more --
    # too strict starves the graph of links entirely on a noisier-than-usual
    # scan (self-hit noise from the walking gait).
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    # Revised after a live regression: an earlier attempt widened this alone
    # (3.0 -> 6.0) to help loop closure tolerate KISS-ICP's larger drift (no
    # wheel/IMU anchor for short-term correction), but that made drift worse,
    # not better -- a wider *search* radius without also raising the
    # *acceptance* bar increased the odds of a false loop closure, plausible
    # here since the office has several visually similar workstation pods
    # (podA/podB/podC) a coarse match could confuse for each other. This time:
    # widen more moderately (4.5, not 6.0) AND tighten every acceptance
    # threshold below together, so a farther-away candidate can be
    # *considered* but only a genuinely high-confidence match gets accepted --
    # more reach without reopening the false-positive risk.
    loop_search_maximum_distance: 4.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    # 2.0, not stock 3.0: tighter pose-uncertainty ceiling for even
    # considering a coarse candidate a fine-match attempt, paired with the
    # wider search radius above.
    loop_match_maximum_variance_coarse: 2.0
    # 0.45/0.55, not stock 0.35/0.45: both response thresholds raised the
    # same ~0.1 amount, requiring a noticeably better scan-correlation score
    # before accepting a loop closure at all -- this is the actual guard
    # against the podA/podB/podC-style false-positive risk the wider search
    # radius reintroduces.
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
