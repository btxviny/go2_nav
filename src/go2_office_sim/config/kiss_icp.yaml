# Project-specific KISS-ICP tuning, replacing kiss-icp's own shipped
# config.yaml (explicitly commented in that file as "just an example... not
# really meant to use for any particular dataset").
#
# Real motivation: slam_toolbox's own scan message filter AND both Nav2
# costmaps were periodically dropping /robot1/scan with "the timestamp on
# the message is earlier than all the data in the transform cache" --
# confirmed live, recurring every ~5-10s across all three independent
# consumers. That error means the TF buffer's own ~10s rolling window
# (hardcoded in nav2_costmap_2d/tf2, not exposed as a tunable param) had
# already evicted the transform a pending scan needed, i.e. something
# occasionally made KISS-ICP's own odom->base_link TF publish stall for
# long enough to strand a scan. The upstream defaults below (max_range
# 100m for a scene where nothing is ever farther than ~25m, and a 500-
# iteration ICP ceiling) bound the *worst case* per-scan compute time far
# higher than this project ever needs -- an occasional harder registration
# hitting anywhere near that ceiling under this machine's real CPU
# contention (confirmed elsewhere this session: load average 9.0 on 8
# cores with the full stack up) is a very plausible source of exactly this
# kind of periodic stall.
#
# /** (not a bare "kiss_icp_node:" key): the exact same bug class as
# slam.yaml's fix earlier this session -- ROS 2's parameter-YAML matching
# requires the top-level key to be "/**", "/<ns>/**", or the node's full
# fully-qualified name; a bare key never matches a namespaced node at all.
# kiss_icp_node runs under /robot1 (see kiss_icp.launch.py's
# PushRosNamespace), so a bare "kiss_icp_node:" key here silently matched
# nothing -- confirmed live via `ros2 param get`-equivalent evidence: the
# node's own startup log kept printing the compiled-in defaults (Max range:
# 100.00, Voxel size: 1.00, Max number of iterations: 500) even after this
# file was created and correctly passed via --params-file. This also means
# kiss-icp's own original config.yaml never actually took effect either,
# for the same reason, from the moment kiss_icp_node was namespaced.
/**:
  ros__parameters:
    data:
      deskew: True
      # 25.0, not 100.0: matches this project's lidar's actual configured
      # range (gazebo.xacro / pointcloud_to_laserscan.yaml both already use
      # 25.0) -- nothing in this scene is ever farther than that, so every
      # point beyond it that the generic default would still consider is
      # pure wasted registration work.
      max_range: 25.0
      # 0.5, matching pointcloud_to_laserscan.yaml's range_min self-hit
      # filter and its own reasoning: filters the same leg self-hit noise
      # out of KISS-ICP's own registration, not just the 2D scan Nav2 sees.
      min_range: 0.5

    mapping:
      # Explicit, not left at "default = max_range/100.0": that default
      # scales *with* max_range, so simply lowering max_range above would
      # have silently made this finer (100.0/100=1.0 before -> 25.0/100=0.25
      # after) and increased per-scan point/voxel count -- the opposite of
      # what this file is for. 0.5 keeps per-scan cost low while still
      # giving reasonable detail in a ~20x20m room.
      voxel_size: 0.5
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      # 100, not 500: this is the actual fix for the periodic TF-gap/message-
      # drop symptom above -- bounds the worst-case time any single scan's
      # registration can take, so one harder-than-usual scan under load
      # can't balloon into a stall long enough to evict TF data a pending
      # message still needs. KISS-ICP registration normally converges in far
      # fewer iterations than this under real motion; 500 was only ever a
      # safety ceiling, never the expected case.
      max_num_iterations: 100
      convergence_criterion: 0.0001
      max_num_threads: 0
