/**:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: scan

    mode: mapping
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 25.0
    min_laser_range: 0.15
    transform_publish_period: 0.02
    transform_timeout: 0.5  
    tf_buffer_duration: 30.0

    throttle_scans: 2
    scan_queue_size: 20

    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 25.0
    correlation_search_space_smear_deviation: 0.05
    loop_search_space_smear_deviation: 0.03
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
