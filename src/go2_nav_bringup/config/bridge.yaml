# ros_gz_bridge parameter_bridge config for the sensors added/modified by this
# package. Topic names are absolute (matching the <topic> tags set in
# go2_description/xacro/gazebo.xacro) rather than relying on ROS namespace
# prefixing — this mirrors upstream's own convention in launch_sim.launch.py,
# where every bridged topic is already fully-qualified with /robot1/...
#
# NOTE: the exact suffixes gz-sim appends to an rgbd_camera's base <topic> were
# verified empirically with `gz topic -l` against a running sim, not assumed.
# See go2_nav/src/go2_nav_bringup/launch/office_sim.launch.py for how this file
# is passed to ros_gz_bridge.

# --- 3D lidar (back-mounted); base /robot1/lidar also carries a flat
#     multi-ring range array we deliberately do not bridge -- not a valid 2D
#     scan once vertical samples > 1. /points is the real payload. ---
- ros_topic_name: "/robot1/lidar/points"
  gz_topic_name: "/robot1/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# --- RGBD camera (head, forward-facing) ---
- ros_topic_name: "/robot1/camera/image"
  gz_topic_name: "/robot1/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/camera/depth_image"
  gz_topic_name: "/robot1/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/camera/points"
  gz_topic_name: "/robot1/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/camera/camera_info"
  gz_topic_name: "/robot1/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
