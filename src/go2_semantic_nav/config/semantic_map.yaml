# Tunables for build_semantic_map.py and semantic_goal.py. Both scripts also accept
# a --config path to override this file; values here are the defaults used when no
# override is given.

# -- Camera / depth handling --
max_depth_m: 5.0        # depth pixels beyond this are dropped before projection.
                         # This sim's rgbd_camera depth <clip> is a known no-op (see
                         # go2_description/xacro/gazebo.xacro's comments) -- it
                         # returns finite depth out to ~9-12m even though the
                         # intended range is 0.3-3m, so this cutoff stands in for it.
min_depth_m: 0.3

# -- build_semantic_map.py --
every_nth_frame: 10      # process every Nth RGB frame from the bag
mask_point_stride: 4     # subsample every Nth pixel (in both axes) within a mask
                          # before projecting, to bound point count per mask
bbox_pad_px: 12           # pixels to expand each mask's fitted bbox by before
                           # cropping for CLIP (gives CLIP a bit of surrounding
                           # context beyond the tight segmentation mask)
sam_checkpoint: "FastSAM-s.pt"
clip_model: "ViT-B-32"
clip_pretrained: "laion2b_s34b_b79k"
voxel_size_m: 0.1

# -- semantic_goal.py --
similarity_threshold: 0.24   # cosine similarity cutoff for a voxel to be considered
                              # a candidate match
top_k_fallback: 1000           # if fewer than this many voxels clear the threshold,
                               # fall back to the top-K by similarity instead
cluster_radius_m: 0.2          # max gap (in metres) between two voxels to still
                                # count as the same object cluster during flood-fill
standoff_distance_m: 1.0        # how far back from the matched cluster's centroid
                                 # to place the Nav2 goal, so it doesn't try to path
                                 # into the object itself
